name: Validate Trivia

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.81.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ matrix.rust }}"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test rules, selection, and rendering
        run: cargo test --locked --all-targets
      - name: Verify generated pages, artwork, and local routes
        run: cargo run --locked -- check
      - name: Check commit whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi

  safety:
    name: Content and Workflow Safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test rejection of unsafe content
        run: cargo test --locked safety
      - name: Validate SVGs, source URLs, and workflows
        run: cargo run --locked -- check-ci
      - name: Download and verify rumdl v0.2.78
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/rvben/rumdl/releases/download/v0.2.78/rumdl-v0.2.78-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/rumdl.tar.gz"
          printf '%s  %s\n' 5597ecab62c6cd50e63f85451fe4e763abc58195a3e7eff9186b6dfae890ca24 "$RUNNER_TEMP/rumdl.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/rumdl.tar.gz" -C "$RUNNER_TEMP"
      - name: Lint repository Markdown with the existing HTML allowlist
        run: '"$RUNNER_TEMP/rumdl" check .'
      - name: Download and verify cargo-audit v0.22.2
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$RUNNER_TEMP/cargo-audit.tgz"
          printf '%s  %s\n' ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 "$RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP"
      - name: Audit locked dependencies and deny advisory warnings
        run: '"$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" audit --deny warnings'

  local-links:
    name: Local Links and Anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify Lychee v0.23.0
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/lychee.tar.gz"
          printf '%s  %s\n' 1fcb6ccf10d04c22b8c5873c5b9cb7be32ee7423e12169d6f1a79a6f1962ef81 "$RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP"
      - name: Check repository-wide links without network requests
        run: |
          mkdir -p lychee
          "$RUNNER_TEMP/lychee" --offline --include-fragments --no-progress \
            --format markdown --output lychee/local-links.md \
            README.md CONTRIBUTING.md './millionaire/**/*.md'
      - name: Show local link report
        if: always()
        run: |
          if [ -f lychee/local-links.md ]; then
            cat lychee/local-links.md >> "$GITHUB_STEP_SUMMARY"
          fi
