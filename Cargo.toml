[package]
name = "eismot"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Deterministic, typed tooling for a Markdown trivia arcade"
publish = false

[dependencies]
anyhow = "=1.0.104"
regex = "=1.11.1"
roxmltree = "=0.20.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
url = "=2.5.4"

[dev-dependencies]
tempfile = "=3.15.0"
